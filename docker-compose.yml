# Banco de dados PostgreSQL para desenvolvimento e demonstração.
#
#   docker compose up -d      → sobe o banco
#   docker compose down       → desliga (os dados continuam guardados)
#   docker compose down -v    → desliga E apaga os dados
#
# Usuário, senha e nome do banco combinam com o backend/.env.example.
services:
  db:
    image: postgres:16
    container_name: integra-nir-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: integra_nir
      POSTGRES_USER: integra
      POSTGRES_PASSWORD: integra
    ports:
      - "5432:5432"
    volumes:
      - integra_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U integra -d integra_nir"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  integra_pgdata:
